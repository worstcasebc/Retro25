# Retro25: /etc/systemd/journald.conf.d/retro25.conf (linux/system/install.sh).
# Journal nur im RAM (/run/log/journal), höchstens 32 MB; nach einem
# Neustart weg. Fehlersuche über einen Hänger hinweg: serielle Konsole.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
