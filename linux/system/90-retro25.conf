# Retro25: Kernel-Einstellungen (nach /etc/sysctl.d/, linux/system/install.sh).
#
# Magic SysRq vollständig freigeben. Ubuntu erlaubt nur sync, remount-ro und
# reboot (176); für die Fehlersuche bei Hängern (z. B. SMMU nach einem
# Core-Wechsel) braucht es auch w (blockierte Tasks) und l (Backtrace aller
# CPUs). Auslösen über die serielle Konsole: BREAK senden, dann die Taste.
# Notfall-Neustart ohne Datenverlust: BREAK+s, BREAK+u, BREAK+b.
kernel.sysrq = 1
