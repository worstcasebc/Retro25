# Retro25: /etc/tmpfiles.d/retro25.conf (linux/system/install.sh).
#
# Die RAM-Ordner aus /etc/fstab sind nach jedem Start leer und gehören root;
# hier bekommen sie die Rechte bzw. Unterordner, die die Dienste erwarten.
d /var/log                   0775 root             syslog           -
d /var/log/apt               0755 root             root             -
d /var/lib/systemd/timesync  0755 systemd-timesync systemd-timesync -

# Main legt den geladenen Core in den RAM (linux/main/de25/fpga_io.cpp);
# der Kernel sucht Firmware zuerst dort, dann in /lib/firmware (main.dtbo).
d /run/retro25-fw/retro25    0755 root             root             -
w /sys/module/firmware_class/parameters/path - - - - /run/retro25-fw
